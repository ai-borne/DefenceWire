name = "defencewire"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-31"

# Story archive database — see d1/schema.sql (SSOT for schema) and
# d1/README.md for one-time provisioning steps.
[[d1_databases]]
binding = "DB"
database_name = "defencewire-archive"
database_id = "6c03abeb-ce1f-4669-8985-dbbdd3735807"

# Cloudflare Workers AI binding for zero-cost edge screening & classification
[ai]
binding = "AI"

# Archived story cluster_json blobs (moved off D1 to stay under D1 quota) —
# see crawler/r2ArchiveStore.ts (GitHub Actions write path, S3-compatible REST)
# and src/archive/archiveRow.ts (Pages Functions read path, native binding).
[[r2_buckets]]
binding = "ARCHIVE_MEDIA"
bucket_name = "defencewire-archive-blobs"

