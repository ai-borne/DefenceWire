name: Phase 14 delete stray R2 test-probe object

on:
  workflow_dispatch:

# Manual-trigger-only, one-off cleanup (Phase 14): deletes the single
# hardcoded `test-live-probe.json` object found by the D1/R2 reconciliation
# report to have no D1 reference at all. Never runs on a schedule; not a
# general-purpose delete tool.
jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Delete stray R2 test-probe object
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: npm run cleanup:r2-test-probe
