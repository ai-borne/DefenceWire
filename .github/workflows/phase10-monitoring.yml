name: Phase 10 topic operational monitoring report

on:
  workflow_dispatch:

# Manual-trigger-only (Phase 13 Stage 9 of the canonical topic knowledge
# base): read-only D1 report of every Phase 10 monitoring signal that is
# actually derivable from the schema against authenticated production.
# Issues no INSERT/UPDATE/DELETE. Fails the job when a real alert condition
# is observed, so a red run is itself the alert-delivery mechanism.
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Phase 10 Monitoring Report (production, read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          npm run monitor:phase10 | tee "$GITHUB_STEP_SUMMARY"
