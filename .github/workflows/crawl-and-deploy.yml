name: 24/7 Autonomous Defence Intelligence Ingestion & Deploy

on:
  schedule:
    # Autonomous ingestion run every 20 minutes ($0 serverless GitHub Actions cron)
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# Every crawler-pushed commit re-triggers this workflow (push trigger), and
# it's also cron- and manually-triggerable — without this, overlapping runs
# can race on both the git branch and the shared D1 archive. Queue instead
# of running in parallel; never cancel a run that's mid-write.
concurrency:
  group: crawl-and-deploy
  cancel-in-progress: false

jobs:
  crawl-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Run 24/7 Defence Ingestion Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: npx vite-node crawler/ingest.ts

      - name: Check D1 Database Size
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run d1:size

      - name: Generate Sitemap
        run: npm run sitemap

      - name: Build Production Assets
        run: npm run build

      - name: Commit & Push Refreshed News Feed
        run: |
          git config user.name "DefenceWire Bot"
          git config user.email "bot@defencewire.in"
          git add public/data/news.json public/sitemap.xml
          if git diff --staged --quiet; then
            echo "No feed changes detected."
          else
            git commit -m "chore(crawler): autonomous refresh of defence intelligence feed [skip ci]"
            git push origin main
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy dist --project-name=defencewire --branch=main --commit-dirty=true

