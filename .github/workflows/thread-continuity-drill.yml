name: Thread continuity non-production drill

on:
  workflow_dispatch:

# Manual-trigger-only, one-off drill (Phase 13 Stage 8 of the canonical topic
# knowledge base): exercises primary-source replacement, merge, split, and
# dormant reactivation against defencewire-archive-nonprod-clone at a scale
# above production's current thread/event counts. Never runs on a schedule
# and never targets production — CLOUDFLARE_D1_DATABASE_ID below is
# overridden to the non-production clone's ID, not the production secret.
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Thread Continuity Drill (non-production clone only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: c83331e1-c5c1-47e2-8d40-c275ad67321d
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run drill:thread-continuity
