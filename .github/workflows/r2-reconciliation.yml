name: Phase 14 D1/R2 reconciliation report

on:
  workflow_dispatch:

# Manual-trigger-only (Phase 14): read-only reconciliation of every R2
# object actually present in the archive bucket against every key D1
# expects to exist. Issues no PUT/DELETE against R2 and no
# INSERT/UPDATE/DELETE against D1. Fails the job when a D1-expected key is
# missing from R2 (a real broken reference); orphaned R2 objects are
# reported, not treated as a failure.
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run D1/R2 Reconciliation (production, read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -o pipefail
          npm run reconcile:r2 | tee "$GITHUB_STEP_SUMMARY"
