name: DefenceWire CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify-and-test:
    name: Build, Typecheck, Test & Audit (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (TypeScript Strict Mode)
        run: npm run typecheck

      - name: Verify Architecture LOC Guardrail (<= 300 LOC)
        run: npm run check:loc

      - name: Run Full Vitest Suite
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Verify Performance Budget (< 35 KB Gzipped Payload)
        run: |
          MAX_SIZE=35840 # 35 KB
          GZ_SIZE=$(gzip -c dist/assets/index-*.js | wc -c | tr -d ' ')
          echo "Gzipped Bundle Size: $GZ_SIZE bytes (Max Budget: $MAX_SIZE bytes)"
          if [ "$GZ_SIZE" -gt "$MAX_SIZE" ]; then
            echo "❌ Performance Budget Exceeded! Bundle size is $GZ_SIZE bytes (> $MAX_SIZE bytes)"
            exit 1
          fi
          echo "✅ Performance budget verified: Under 35 KB."

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high
