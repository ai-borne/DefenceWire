name: DefenceWire CI Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/data/news.json'
      - 'public/sitemap.xml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'public/data/news.json'
      - 'public/sitemap.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_duplicate:
    name: Check for Duplicate Run
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fast Gatekeeper Active
        run: echo "🚀 Concurrency group active for ${{ github.ref }}"

  setup:
    name: Prime Dependency Cache
    needs: [check_duplicate]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      # Runs npm ci once, up front, so every downstream job restores a warm
      # ~/.npm cache instead of 5+ jobs racing a cold npm ci against the
      # registry at the same instant (previously the actual cause of the
      # unit_tests/security_and_compliance jobs blowing their timeouts).
      - name: Install Dependencies
        run: npm ci

  typecheck:
    name: Typecheck (Strict TS)
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  contracts_and_guardrails:
    name: Contracts & LOC Guardrails
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Architecture & Contracts
        run: npm run check:contracts

  unit_tests:
    name: Unit & Integration Tests
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite
        run: npm test

  crawler_validation:
    name: Crawler Pipeline Dry-Run
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate 40+ Feed Registry & Parser
        run: npm run check:crawler

  security_and_compliance:
    name: Security & Compliance Audit
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Vulnerability Audit
        run: npm run check:security

  build_and_budget:
    name: Web Build & Performance Budget
    needs: [typecheck, contracts_and_guardrails, unit_tests]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Verify Performance Payload Budget (< 35 KB)
        run: npm run check:budget

  ci_success:
    name: CI Success
    needs:
      - check_duplicate
      - setup
      - typecheck
      - contracts_and_guardrails
      - unit_tests
      - crawler_validation
      - security_and_compliance
      - build_and_budget
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate CI Pipeline Result
        run: |
          if [ "${{ needs.check_duplicate.result }}" != "success" ] || \
             [ "${{ needs.setup.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.contracts_and_guardrails.result }}" != "success" ] || \
             [ "${{ needs.unit_tests.result }}" != "success" ] || \
             [ "${{ needs.crawler_validation.result }}" != "success" ] || \
             [ "${{ needs.security_and_compliance.result }}" != "success" ] || \
             [ "${{ needs.build_and_budget.result }}" != "success" ]; then
            echo "❌ CI Pipeline Failed: One or more prerequisite jobs failed."
            exit 1
          fi
          echo "🎉 All CI Verification Gates Passed Successfully!"
