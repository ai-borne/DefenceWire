name: DefenceWire CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-duplicate:
    name: Check for Duplicate Run
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Concurrency Initialized
        run: echo "🚀 Fast Gatekeeper: Concurrency group active for ${{ github.ref }}"

  typecheck:
    name: Typecheck (Strict TS)
    needs: [check-duplicate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  contracts-and-guardrails:
    name: Contracts & LOC Guardrails
    needs: [check-duplicate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Architecture & Contracts
        run: npm run check:contracts

  unit-tests:
    name: Unit & Integration Tests
    needs: [check-duplicate]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite
        run: npm test

  crawler-validation:
    name: Crawler Pipeline Dry-Run
    needs: [check-duplicate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate 40+ Feed Registry & Parser
        run: npm run check:crawler

  security-and-compliance:
    name: Security & Compliance Audit
    needs: [check-duplicate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Vulnerability Audit
        run: npm run check:security

  build-and-budget:
    name: Web Build & Performance Budget
    needs: [typecheck, contracts-and-guardrails, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Verify Performance Payload Budget (< 35 KB)
        run: npm run check:budget

  ci-success:
    name: CI Success
    needs:
      - check-duplicate
      - typecheck
      - contracts-and-guardrails
      - unit-tests
      - crawler-validation
      - security-and-compliance
      - build-and-budget
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate CI Pipeline Result
        run: |
          if [ "${{ needs.check-duplicate.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.contracts-and-guardrails.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.crawler-validation.result }}" != "success" ] || \
             [ "${{ needs.security-and-compliance.result }}" != "success" ] || \
             [ "${{ needs.build-and-budget.result }}" != "success" ]; then
            echo "❌ CI Pipeline Failed: One or more prerequisite jobs failed."
            exit 1
          fi
          echo "🎉 All CI Verification Gates Passed Successfully!"
